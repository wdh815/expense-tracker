<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 연동 실습</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <nav class="nav">
    <a href="index.html">← 개인 소개</a>
  </nav>

  <h1 class="demo-title">가계부 API 연동 실습</h1>
  <p class="subtitle">FastAPI로 만든 백엔드(Render 배포)를 직접 호출해 거래를 등록·조회·삭제합니다.</p>

  <p class="api-note">현재 연결된 백엔드 주소: <code id="api-base-label"></code></p>

  <div class="card">
    <h2>거래 등록</h2>
    <form class="tx-form" id="transaction-form">
      <div>
        <label for="amount">금액</label>
        <input type="number" id="amount" name="amount" min="1" step="1" required>
      </div>
      <div>
        <label for="type">구분</label>
        <select id="type" name="type" required>
          <option value="expense">지출</option>
          <option value="income">수입</option>
        </select>
      </div>
      <div>
        <label for="category">카테고리</label>
        <input type="text" id="category" name="category" maxlength="50" placeholder="예: 식비" required>
      </div>
      <div>
        <label for="occurred_on">날짜</label>
        <input type="date" id="occurred_on" name="occurred_on" required>
      </div>
      <div class="full">
        <label for="description">설명 (선택)</label>
        <input type="text" id="description" name="description" maxlength="200" placeholder="예: 학생식당 점심">
      </div>
      <button type="submit" class="submit-btn">등록하기</button>
    </form>
    <p class="status" id="form-status"></p>
  </div>

  <div class="card">
    <div class="list-header">
      <h2>거래 목록</h2>
      <button type="button" class="refresh-btn" id="refresh-btn">새로고침</button>
    </div>
    <ul class="tx-list" id="transaction-list"></ul>
    <p class="status" id="list-status"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
